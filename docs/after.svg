<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="What you can do after Cyber is on">
  <rect width="960" height="340" rx="28" fill="#0c0d14"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="32" y="32" width="288" height="276" rx="22" fill="#141621"/>
    <text x="56" y="78" fill="#ff5a6a" font-size="13" font-weight="650" letter-spacing="1.5">YOUR APPS</text>
    <text x="56" y="118" fill="#f6f7f9" font-size="22" font-weight="600">Make one yours</text>
    <text x="56" y="160" fill="#c5cad4" font-size="15">Open Settings.</text>
    <text x="56" y="186" fill="#c5cad4" font-size="15">Open Your apps.</text>
    <text x="56" y="212" fill="#c5cad4" font-size="15">Change the name.</text>
    <text x="56" y="238" fill="#c5cad4" font-size="15">Change the picture.</text>
    <text x="56" y="264" fill="#c5cad4" font-size="15">Pick a colour.</text>

    <rect x="336" y="32" width="288" height="276" rx="22" fill="#141621"/>
    <text x="360" y="78" fill="#ff5a6a" font-size="13" font-weight="650" letter-spacing="1.5">SECOND SCREEN</text>
    <text x="360" y="118" fill="#f6f7f9" font-size="22" font-weight="600">Use the stick</text>
    <text x="360" y="154" fill="#f6f7f9" font-size="22" font-weight="600">as a screen</text>
    <text x="360" y="196" fill="#c5cad4" font-size="15">Open Second screen.</text>
    <text x="360" y="222" fill="#c5cad4" font-size="15">Same Wi-Fi.</text>
    <text x="360" y="248" fill="#c5cad4" font-size="15">On the computer, run</text>
    <text x="360" y="274" fill="#c5cad4" font-size="15">the line below.</text>

    <rect x="640" y="32" width="288" height="276" rx="22" fill="#141621"/>
    <text x="664" y="78" fill="#ff5a6a" font-size="13" font-weight="650" letter-spacing="1.5">IF IT LOOKS WRONG</text>
    <text x="664" y="118" fill="#f6f7f9" font-size="22" font-weight="600">Try again</text>
    <text x="664" y="160" fill="#c5cad4" font-size="15">Same Wi-Fi.</text>
    <text x="664" y="186" fill="#c5cad4" font-size="15">ADB debugging on.</text>
    <text x="664" y="212" fill="#c5cad4" font-size="15">Use the address from</text>
    <text x="664" y="238" fill="#c5cad4" font-size="15">About  >  Network.</text>
    <text x="664" y="264" fill="#c5cad4" font-size="15">Run install.sh again.</text>
  </g>
</svg>
