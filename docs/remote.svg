<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="What the remote does">
  <rect width="960" height="250" rx="28" fill="#0c0d14"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="52" fill="#f6f7f9" font-size="22" font-weight="600">The remote</text>

    <rect x="48" y="84" width="200" height="64" rx="18" fill="#171922" stroke="#ff5a6a" stroke-opacity="0.7"/>
    <text x="148" y="123" text-anchor="middle" fill="#f6f7f9" font-size="18" font-weight="650">Home</text>
    <text x="48" y="180" fill="#a7adba" font-size="15">Opens Cyber</text>

    <rect x="272" y="84" width="200" height="64" rx="18" fill="#171922" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="372" y="123" text-anchor="middle" fill="#f6f7f9" font-size="18" font-weight="600">Arrows</text>
    <text x="272" y="180" fill="#a7adba" font-size="15">Move along the apps</text>

    <rect x="496" y="84" width="200" height="64" rx="18" fill="#171922" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="596" y="123" text-anchor="middle" fill="#f6f7f9" font-size="18" font-weight="600">Select</text>
    <text x="496" y="180" fill="#a7adba" font-size="15">Opens the app</text>

    <rect x="720" y="84" width="192" height="64" rx="18" fill="#171922" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="816" y="123" text-anchor="middle" fill="#f6f7f9" font-size="18" font-weight="600">Back</text>
    <text x="720" y="180" fill="#a7adba" font-size="15">Leaves a screen</text>

    <text x="48" y="222" fill="#8e95a3" font-size="15">The TV button opens Amazon. It stays there until you press Home again.</text>
  </g>
</svg>
